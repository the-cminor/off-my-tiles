const PX_CACHE=new Map();
function pxRuns(cells){const byRow={};cells.forEach(([x,y])=>{(byRow[y]=byRow[y]||[]).push(x)});let d="";
  Object.keys(byRow).forEach(y=>{const xs=byRow[y].sort((a,b)=>a-b);let i=0;while(i<xs.length){let j=i;while(j+1<xs.length&&xs[j+1]===xs[j]+1)j++;const w=xs[j]-xs[i]+1;d+=`M${xs[i]} ${y}h${w}v1h-${w}z`;i=j+1}});return d}
function px(def){if(PX_CACHE.has(def))return PX_CACHE.get(def);
  const rows=def.split("/").map(r=>(r+"............").slice(0,12)),g=[];
  for(let y=0;y<14;y++){g.push([]);for(let x=0;x<14;x++){const r=rows[y-1];g[y].push(r&&x>0&&x<13?r[x-1]:".")}}
  const f=(y,x)=>y>=0&&x>=0&&y<14&&x<14&&g[y][x]!==".";const all=[],ol=[],by={};
  for(let y=0;y<14;y++)for(let x=0;x<14;x++){const c=g[y][x];
    if(c==="."){if(f(y-1,x)||f(y+1,x)||f(y,x-1)||f(y,x+1)){ol.push([x,y]);all.push([x,y])}}
    else if(c==="K"){ol.push([x,y]);all.push([x,y])}else{(by[c]=by[c]||[]).push([x,y]);all.push([x,y])}}
  let o=`<svg class="pxe" viewBox="0 0 15 15" shape-rendering="crispEdges" aria-hidden="true"><path d="${pxRuns(all.map(([x,y])=>[x+1,y+1]))}" fill="#0f1020" fill-opacity=".45"/><path d="${pxRuns(ol)}" fill="#1a1c2c"/>`;
  for(const c in by)o+=`<path d="${pxRuns(by[c])}" fill="${PXPAL[c]||"#808080"}"/>`;o+="</svg>";PX_CACHE.set(def,o);return o}

            `${list(A)} มีช่องว่างอยู่แค่ใน${list(B)} ทั้ง ${k} ${st==="reg"?"โซน":st==="row"?"แถว":"คอลัมน์"}ต้องวาง ${k} ตัวลงในนั้นให้ครบ ช่องอื่นใน${list(B)}จึงวางไม่ได้`);

function balance(el){const k=[...el.children].filter(c=>!c.hidden),n=k.length;if(n<2){el.style.removeProperty("--cols");return}

  const W=el.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)+.5,ws=k.map(c=>c.getBoundingClientRect().width/s);
  const fits=c=>{let t=gap*(c-1);for(let j=0;j<c;j++){let m=0;for(let i=j;i<n;i+=c)m=Math.max(m,ws[i]);t+=m}return t<=W};

     `<li><b>กลับไปเริ่มต้น:</b> เลเวล ⭐ ดาว สถิติชนะติดกัน สถิติสูงสุด คำใบ้ และธีมที่ปลดล็อก</li>
      <li><b>คะแนนของคุณใน 🐐 G.O.A.T. จะถูกลบ</b></li>
      <li><b>ยังอยู่:</b> ภาษา ชื่อ ธีมเทศกาล และผลเกมรายวันของวันนี้</li>`)}</ul>

async function doReset(){
  if(mode!=="main"){if(mode==="daily")pauseDaily();mode="main";festT=null;mainSnap=null}
  level=1;score=0;streak=0;best=0;hX=5;hA=1;themeId="animals";coachStep=0;

/* ---------- themes ---------- */
function T(){const t=THEMES.find(t=>t.id===themeId),ok=x=>x&&(isEvent(x)?inSeason(x)&&wonNow(x.id):x.crown?goatNow:true);if(ok(t))return t;
  /* lost #1 while using G.O.A.T.: play the theme you had before; it switches back by itself if you retake #1 */
  if(t&&t.crown){const p=THEMES.find(x=>x.id===goatPrev);if(p&&!p.crown&&ok(p)&&themeOpen(p))return p}return THEMES[0]}
function curTheme(){return mode==="fest"&&festT?festT:T()}
/* paint tiles, ✕ colour, page background, panels and board frame from the current theme */
let uiMode=store.get("uiMode","system");
function applyMode(){const r=document.documentElement;if(uiMode==="system")r.removeAttribute("data-mode");else r.setAttribute("data-mode",uiMode);applyChrome()}
function isDarkUI(){if(uiMode==="dark")return true;if(uiMode==="light")return false;const a=document.documentElement.getAttribute("data-theme");return a==="dark"||(a!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)}
const GOAT_UI={"--bg":"#211a0c","--bg2":"#120e06","--panel":"#2e2510","--board":"#c9a14a","--frame":"#d9a420","--ink":"#f6e7c1","--muted":"#c9a97a","--accent":"#b8801a","--shadow":"0 3px 0 rgba(0,0,0,.45)"};
/* Theme Lab (v15): board frame and page background picked per theme; panels and text follow the background */
const LAB={"animals":{"frameDay":"#fff5e8","frameNight":"#f1e2cf"},"christmas":{"frameDay":"#4bae87","frameNight":"#036f4f"},"loykrathong":{"frameDay":"#f3f7fe","frameNight":"#dbe5f9","bgDay":"#e8effc","bgNight":"#1c2435"}};
const labRgb=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),labLin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
const labLum=x=>{const[r,g,b]=labRgb(x).map(labLin);return .2126*r+.7152*g+.0722*b};
const labMix=(a,b,t)=>"#"+labRgb(a).map((v,i)=>Math.round(v+(labRgb(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
function chromeVars(t,dk){const h=TINTS[t.id]??75,v={};if(t.id==="goat")return{...GOAT_UI};
  if(dk){v["--bg"]=oklchHex(.26,.035,h);v["--panel"]=oklchHex(.32,.035,h)}else{v["--bg"]=oklchHex(.95,.035,h);v["--panel"]=oklchHex(.985,.012,h)}
  const L=LAB[t.id],bg=L&&(dk?L.bgNight:L.bgDay);
  if(bg){const dark=labLum(bg)<.18,ink=dark?"#f1ece4":"#3a2a1c";v["--bg"]=bg;v["--panel"]=dark?labMix(bg,"#ffffff",.09):labMix(bg,"#ffffff",.7);v["--ink"]=ink;v["--muted"]=labMix(ink,bg,.38)}
  return v}
function applyChrome(){const t=curTheme(),h=TINTS[t.id]??75,s=document.documentElement.style,dk=isDarkUI();
  const set=(k,v)=>s.setProperty(k,v);
  ["--ink","--muted","--accent","--shadow","--frame"].forEach(k=>s.removeProperty(k));s.colorScheme="";
  if(t.id==="goat"){for(const k in GOAT_UI)set(k,GOAT_UI[k]);s.colorScheme="dark";return}
  if(dk){set("--bg",oklchHex(.26,.035,h));set("--bg2",oklchHex(.20,.04,h));set("--panel",oklchHex(.32,.035,h));set("--board",oklchHex(.92,.03,h))}
  else{set("--bg",oklchHex(.95,.035,h));set("--bg2",oklchHex(.885,.06,h));set("--panel",oklchHex(.985,.012,h));set("--board",oklchHex(.975,.02,h))}
  const L=LAB[t.id];if(!L)return;const fr=dk?L.frameNight:L.frameDay,bg=dk?L.bgNight:L.bgDay;if(fr){set("--board",fr);set("--frame",fr)}
  if(bg){const dark=labLum(bg)<.18,ink=dark?"#f1ece4":"#3a2a1c";set("--bg",bg);set("--bg2",labMix(bg,"#000000",dark?.25:.07));
    set("--panel",dark?labMix(bg,"#ffffff",.09):labMix(bg,"#ffffff",.7));set("--ink",ink);set("--muted",labMix(ink,bg,.38))}}
function paintBoard(){const t=curTheme();palNow=PALETTES[t.id]||PALETTES.animals;palNamesNow=paletteNames(palNow);applyChrome();if(!P)return;
  [...board.children].forEach((c,k)=>{const col=palNow[P.reg[k]%palNow.length];c.style.background=col;c.style.setProperty("--cellx",xColorFor(col))})}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyChrome);
  new MutationObserver(applyChrome).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
function applyTheme(){paintBoard();if(!P)return;const t=curTheme();P.animal=mode==="fest"?t.pieces[0]:mode==="daily"?t.pieces[dayNum()%t.pieces.length]:t.pieces[(level-1)%t.pieces.length];
  const pa=pxE(P.animal);board.querySelectorAll(".cell .a").forEach(s=>s.innerHTML=pa);$("placeIcon").innerHTML=pa;renderStrip();renderLives()}
function themeState(t){const open=isEvent(t)?wonNow(t.id):themeOpen(t);
  const status=t.id===T().id&&open?`${tr("In use","ใช้อยู่")} · ${pxE(t.life)}`:open?(isEvent(t)?tr("🎉 This month only","🎉 ใช้ได้เดือนนี้"):`${tr("Lives","ชีวิต")}: ${pxE(t.life)}`)
    :isEvent(t)?tr("Win the festival challenge","ผ่านภารกิจเทศกาลเพื่อปลดล็อก"):t.crown?tr("Only for #1 on the 🐐 G.O.A.T. board","ใช้ได้เฉพาะอันดับ 1 บนตาราง 🐐 G.O.A.T."):tr(`Clear level ${t.at} to unlock`,`ผ่านเลเวล ${t.at} เพื่อปลดล็อก`);
  return{open,status}}
function themeCard(t,wide){const{open,status}=themeState(t);
  return`<button class="theme ${t.id===T().id&&open?"sel":""} ${open?"":"locked"} ${wide?"wide":""} ${t.crown?"crown":""}" data-id="${t.id}">
    <span class="pcs">${wide?t.pieces.map(p=>`<span>${pxE(p)}</span>`).join(""):open?t.pieces.slice(0,t.crown?5:3).map(pxE).join(""):"🔒"}</span><span class="tn">${tName(t)}</span><small>${status}</small></button>`}

    ${fest.length?`<div class="festrow"><div class="festlbl">🎉 ${tr("Festival now","เทศกาลตอนนี้")}</div>${fest.map(t=>themeCard(t,true)).join("")}</div>`:""}

function showThemeDetail(id){dockSide="right";const t=THEMES.find(x=>x.id===id);const{open,status}=themeState(t);const inUse=open&&t.id===T().id;

/* ---------- daily puzzle: same 9×9 for everyone each day (Bangkok date); timer, +30 s per mistake; first finish counts ---------- */

  let h=0;for(const ch of"daily"+dayKey())h=(h*31+ch.charCodeAt(0))>>>0;
  let best=null,bs=-2;for(let i=0;i<8;i++){const c=generateN(9,rng(h+i*104729));if(!c)continue;const s=gradeP(c);if(s>bs){bs=s;best=c}}
  dailyCache={date:dayKey(),P:best};return best}
function enterDaily(){freshDaily();if(daily.done){showBoard("daily");return}if(busy||mode!=="main")return;clearFocus();
  mainSnap={P,marks:marks.slice(),lives,placed,combo,mistakes};mode="daily";festT=null;
  busy=true;$("loading").textContent=tr("Preparing today's puzzle…","กำลังเตรียมด่านวันนี้…");$("loading").hidden=false;board.style.visibility="hidden";
  setTimeout(()=>{P=genDaily();setup();$("loading").hidden=true;$("loading").textContent=tr("Building puzzle…","กำลังสร้างด่าน…");board.style.visibility="";busy=false;
    renderFestBar();resumeDaily();renderDailyClock();fit()},40)}
function dailyRank(){const rows=dailyRows.filter(r=>r.date===dayKey()&&r.ms>0).sort(dailyCmp);const i=rows.findIndex(r=>r.id===myId);return i<0?null:i+1}

  if(dailyCol&&myId){try{await dailyCol.doc(myId).set({date:daily.date,ms:daily.final,mistakes:daily.mistakes,name:nick,at:Date.now()});dailyDenied=false}catch(e){dailyDenied=true}}
  const rk=dailyRank();
  overlay(`<div class="big-emoji">📅🎉</div><h2>${tr("Daily complete!","ผ่านเกมรายวัน!")}</h2>
    <div class="gain" style="font-size:34px">⏱ ${fmtTime(daily.final)}</div>
    <p>${daily.mistakes?tr(`Includes +${daily.mistakes*30}s for ${daily.mistakes} mistake${daily.mistakes>1?"s":""}.`,`รวมเวลาปรับ +${daily.mistakes*30} วิ จากการวางผิด ${daily.mistakes} ครั้ง`):tr("No mistakes. Clean run!","ไม่ผิดเลย สุดยอด!")}
    ${rk?`<br><b>${tr(`#${rk} today`,`อันดับ ${rk} ของวันนี้`)}</b>`:dailyDenied?`<br>${tr("Your time is saved on this device, but can't join the ranking without edit access.","บันทึกเวลาไว้ในเครื่องแล้ว แต่ยังขึ้นอันดับไม่ได้จนกว่าจะได้สิทธิ์ Editor")}`:""}<br>${tr("A new puzzle arrives tomorrow.","พรุ่งนี้มีด่านใหม่")}</p>

setInterval(()=>{if(mode==="main"&&daily&&daily.date!==dayKey())renderFestBar()},60000);
function gradeP(cand){const saveP=P;P=cand;let sc=0;
  try{const n=cand.n,G=buildGroups(),M={cand:new Array(n*n).fill(true),placed:new Array(n*n).fill(false)};
    for(let g=0;g<400;g++){const s=nextRule(M,G);if(!s)break;sc+=(s.w||1)*(s.w||1);if(s.kind==="place")mPlace(M,s.cell);else s.targets.forEach(k=>M.cand[k]=false)}
    if(M.placed.filter(Boolean).length!==n)sc=-1}finally{P=saveP}return sc}
function genFest(t){if(festCache[t.id])return festCache[t.id];
  let h=0;for(const ch of t.id+new Date().getFullYear())h=(h*31+ch.charCodeAt(0))>>>0;
  let best=null,bs=-2;for(let i=0;i<6;i++){const c=generateN(10,rng(h+i*7919));if(!c)continue;const s=gradeP(c);if(s>bs){bs=s;best=c}}
  return festCache[t.id]=best}
function enterFest(){const ft=activeFest();if(!ft||busy||mode!=="main")return;clearFocus();

  setTimeout(()=>{P=genFest(ft);setup();$("loading").hidden=true;$("loading").textContent=tr("Building puzzle…","กำลังสร้างด่าน…");board.style.visibility="";busy=false;renderFestBar();fit()},40)}

  renderLives();renderStrip();updateTools();renderFestBar();fit()}
function festWin(){const t=festT;if(!wonNow(t.id)){festWon.push(festKey(t.id));store.set("festWon",festWon);saveCloud()}

    <div class="unlock-preview"><span>${t.pieces.slice(0,5).map(pxE).join(" ")}</span><small>${tr("Lives","ชีวิต")}: ${pxE(t.life)} ${pxE(t.life)} ${pxE(t.life)}</small></div>
    <button class="big" id="useTheme">${tr(`Play with ${tName(t)}`,`เล่นธีม${tName(t)}`)}</button>
    <button class="big alt" id="keepTheme">${tr(`Back to Level ${level}`,`กลับไปเลเวล ${level}`)}</button>`);
  $("useTheme").onclick=()=>{themeId=t.id;store.set("theme",themeId);saveCloud();closeOv();exitFest()};

function festLose(){const t=festT;

    <p>${tr("No stars or streak lost. The festival puzzle is waiting whenever you're ready.","ไม่เสียดาวหรือสถิติชนะติดกัน ลองภารกิจเทศกาลใหม่ได้ทุกเมื่อ")}</p>

/* ---------- tablet fit: scale the whole game up to use big screens; phones stay at 1 ---------- */
function fit(){const app=document.querySelector(".app");app.style.zoom="";fitW=innerWidth;fitH=innerHeight;const keep=curShift;setShift(0);
  // measure at natural size: everything, and everything down to the tool buttons
  const kids=[...app.children].filter(e=>!e.hidden&&e.id!=="hintSheet"),top0=app.getBoundingClientRect().top;
  const bAll=Math.max(...kids.map(e=>e.getBoundingClientRect().bottom))-top0+38;
  const bTools=Math.max(...kids.filter(e=>e.id!=="helpText").map(e=>e.getBoundingClientRect().bottom))-top0+26;
  const sw=document.documentElement.scrollWidth;
  const grow=Math.min((innerWidth-32)/480,(innerHeight-8)/bAll);
  // shrink evenly if the window is too short (fit down to the buttons) or too narrow; blank space fills the rest
  const shrink=Math.min((innerHeight-8)/bTools,sw>innerWidth?innerWidth/sw:1);
  const zz=grow>1.05?Math.min(grow,1.8):(shrink<0.98?Math.max(shrink,0.4):1);
  app.style.zoom=zz===1?"":String(zz);
  if(zz<1){// fine-tune: the page padding doesn't scale, so re-measure and nudge until the buttons and width fit
    let z2=zz;for(let i=0;i<4;i++){const tb=document.querySelector(".tools").getBoundingClientRect().bottom-Math.min(0,app.getBoundingClientRect().top),w2=document.documentElement.scrollWidth;
      const f=Math.min((innerHeight-6)/tb,innerWidth/w2);if(f>=0.995)break;z2=Math.max(0.35,z2*f*0.99);app.style.zoom=String(z2)}}cardZ=zz>1?Math.min(zz,1.4):1;fitCard();setShift(keep);balAll()}
let cardZ=1;function fitCard(){const c=$("ovCard");c.style.zoom=cardZ>1?String(cardZ):"";c.style.setProperty("--cz",cardZ)}
let fitT=null;addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(()=>{
  const dw=Math.abs(innerWidth-fitW),dh=Math.abs(innerHeight-fitH);if(dw<2&&(dh<160||sheetBelow)){placeSheet();placeDock();balAll();return}
  fitW=innerWidth;fitH=innerHeight;fit();placeSheet();placeDock();balAll()},120)});document.documentElement.classList.add("lock");applyMode();
